<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ricarica Solare</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mu:#5d6b78;--ac:#e08a00;--ok:#1e9e5a;--bad:#d33;--bd:#dde3e9;--car:#2b7de9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151b;--card:#18212a;--tx:#e8eef3;--mu:#93a1ad;--bd:#2a3642;--ac:#f5a623;--ok:#3ccf7f;--bad:#ff6b6b;--car:#5aa2ff}}
:root[data-theme="dark"]{--bg:#0f151b;--card:#18212a;--tx:#e8eef3;--mu:#93a1ad;--bd:#2a3642;--ac:#f5a623;--ok:#3ccf7f;--bad:#ff6b6b;--car:#5aa2ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:560px;margin:auto}
h1{font-size:20px;margin:6px 4px 12px}.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}label:first-child{margin-top:0}
input,select,button{font:inherit;color:var(--tx)}input[type=datetime-local],input[type=time],input[type=number]{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
input[type=range]{width:100%;accent-color:var(--ac)}.row{display:flex;gap:8px}.row>*{flex:1}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px 0;border:1px solid var(--bd);background:var(--bg);border-radius:10px}.seg button.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}
.v{float:right;color:var(--tx);font-weight:700}.sm{font-size:12px;color:var(--mu)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.k{background:var(--bg);border-radius:12px;padding:10px}.k b{display:block;font-size:24px}.k span{font-size:12px;color:var(--mu)}
button.t{padding:8px 12px;border:1px solid var(--bd);background:var(--bg);border-radius:10px}.bad{color:var(--bad)}.ok{color:var(--ok)}
details summary{cursor:pointer;font-weight:600}svg{width:100%;height:auto;display:block}
</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f151b"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ricarica">
</head><body>
<h1>☀️ Ricarica solare auto</h1>

<div class="c">
<label>Data e ora del calcolo</label>
<div class="row"><input type="datetime-local" id="dt"><button class="t" id="now" style="flex:0 0 auto">Adesso</button></div>
<label>Potenza di ricarica (A) <span class="v" id="kwv"></span></label>
<div class="seg" id="amps"></div>
<label>Carica casa ora <span class="v" id="hv"></span></label><input type="range" id="h" min="0" max="100" value="80">
<label>Carica auto ora <span class="v" id="av"></span></label><input type="range" id="a" min="0" max="100" value="30">
<div class="row"><div><label>Inizio ricarica</label><input type="time" id="st" value="11:00"></div><div><label>Fine ricarica</label><input type="time" id="en" value="15:00"></div></div>
<label>Nuvolosità <span class="v" id="cv"></span> <button class="t" id="auto" style="float:right;padding:2px 8px">Auto</button></label><input type="range" id="cl" min="0" max="100" value="30">
<div class="sm" id="cs"></div>
<label>Consumo casa durante la ricarica (kW)</label><input type="number" id="ld" step="0.05" min="0">
</div>

<div class="c" id="res"></div>
<div class="c"><div class="sm">Carica batteria casa nel tempo</div><svg id="ch" viewBox="0 0 300 90"></svg></div>

<details class="c"><summary>Impostazioni (salvate)</summary>
<label>Consumo base casa (kW medi)</label><input type="number" id="base" step="0.05" min="0">
<label>Capacità batteria auto (kWh)</label><input type="number" id="cap" step="0.5" min="10">
<label>Rendimento ricarica (% che arriva in auto)</label><input type="number" id="eff" min="50" max="100">
<label>Batteria casa (kWh)</label><input type="number" id="bat" step="0.5" min="1">
<label>Picco solare sereno estate (kW)</label><input type="number" id="pk" step="0.1" min="0.5">
<label>Ricarica massima batterie (kW)</label><input type="number" id="chg" step="0.1" min="0.5">
<label>Scarica massima batterie (kW)</label><input type="number" id="dis" step="0.1" min="0.5">
<label>Potenza totale massima con sole (kW)</label><input type="number" id="tot" step="0.1" min="0.5">
<div class="sm" style="margin-top:8px">Valencia 39,47° N. Le ore di sole sono calcolate dalla posizione del sole; la nuvolosità arriva da Open-Meteo se online.</div></details>

<script>
var LAT=39.47,LON=-0.376,REF=0.961,V=230,$=function(i){return document.getElementById(i)};
var S={base:0.4,cap:60,eff:75,bat:18,pk:3.5,chg:2,dis:2.5,tot:5,amp:8,ld:null};
try{var o=JSON.parse(localStorage.getItem("rs")||"{}");for(var k in o)S[k]=o[k]}catch(e){}
function save(){try{localStorage.setItem("rs",JSON.stringify(S))}catch(e){}}
var pad=function(n){return(n<10?"0":"")+n};
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function hm(ms){var d=new Date(ms);return pad(d.getHours())+":"+pad(d.getMinutes())}
function sinE(ms){var d=new Date(ms),y=new Date(d.getFullYear(),0,0),doy=Math.floor((d-y)/864e5),h=d.getHours()+d.getMinutes()/60;
var g=2*Math.PI/365*(doy-1+(h-12)/24),eot=229.18*(7.5e-5+.001868*Math.cos(g)-.032077*Math.sin(g)-.014615*Math.cos(2*g)-.040849*Math.sin(2*g)),
de=.006918-.399912*Math.cos(g)+.070257*Math.sin(g)-.006758*Math.cos(2*g)+.000907*Math.sin(2*g)-.002697*Math.cos(3*g)+.00148*Math.sin(3*g),
tz=-d.getTimezoneOffset()/60,tst=h*60+eot+4*(LON-15*tz),ha=(tst/4-180)*Math.PI/180,la=LAT*Math.PI/180;
return Math.sin(la)*Math.sin(de)+Math.cos(la)*Math.cos(de)*Math.cos(ha)}
function sunInfo(day){var m0=new Date(day.getFullYear(),day.getMonth(),day.getDate()).getTime(),a=null,b=null;
for(var m=0;m<1440;m++){if(sinE(m0+m*6e4)>0){if(a===null)a=m;b=m}}return a===null?null:{a:m0+a*6e4,b:m0+b*6e4,h:(b-a)/60}}
var hourly={},auto=true,cloudOK=false;
function cloudAt(ms){if(!auto)return +$("cl").value/100;var d=new Date(ms),k=iso(d)+"T"+pad(d.getHours());return hourly[k]!==undefined?hourly[k]/100:+$("cl").value/100}
function ends(){var c=new Date($("dt").value).getTime(),day=new Date(c),p=function(v){var x=v.split(":");return new Date(day.getFullYear(),day.getMonth(),day.getDate(),+x[0],+x[1]).getTime()};
var s=p($("st").value),e=p($("en").value);if(s<c-6e4)s+=864e5;if(s<c)s=c;if(e<=s)e+=864e5;if(e<=s)e=s+36e5;return{c:c,s:s,e:e}}
function loadCloud(){var t=ends();$("cs").textContent="Previsione nuvolosità: caricamento…";
var u="https://api.open-meteo.com/v1/forecast?latitude="+LAT+"&longitude="+LON+"&hourly=cloud_cover&timezone=auto&start_date="+iso(new Date(t.c))+"&end_date="+iso(new Date(t.e));
fetch(u).then(function(r){return r.json()}).then(function(j){hourly={};j.hourly.time.forEach(function(x,i){hourly[x.slice(0,13)]=j.hourly.cloud_cover[i]});cloudOK=true;
var d=iso(new Date(t.c)),v=[];for(var h=9;h<=17;h++){var q=hourly[d+"T"+pad(h)];if(q!==undefined)v.push(q)}
if(v.length)$("cl").value=Math.round(v.reduce(function(a,b){return a+b},0)/v.length);calc()}).catch(function(){cloudOK=false;auto=false;calc()})}
function calc(){S.cl=null;var t=ends(),cap=S.bat,wall0=S.amp*V/1000,house=+$("ld").value,eff=S.eff/100,E=cap*$("h").value/100,car=$("a").value/100*S.cap,carMax=S.cap,exh=null,thr=null,hs=null,sol=0,ser=[],peak=house+wall0,dt=5/60;
for(var ms=t.c;ms<=t.e;ms+=3e5){var ch=ms>=t.s&&ms<t.e,c=cloudAt(ms),f=1-.75*Math.pow(c,3.4),p=Math.max(0,sinE(ms))/REF*S.pk*f,w=(ch&&car<carMax-1e-6)?wall0:0,hl=ch?house:+S.base,sup=Math.min(S.tot,p+Math.min(S.dis,E/dt));if(hl+w>sup+1e-9){if(w>0){w=Math.max(0,sup-hl);if(!thr)thr=ms}}var ld=hl+w;
if(hs===null&&ms>=t.s)hs=E/cap*100;
var n=p-ld,e=E+(n>=0?Math.min(n,S.chg):Math.max(n,-S.dis))*dt;if(e<=1e-6&&n<0&&exh===null)exh=ms;e=Math.min(cap,Math.max(0,e));E=e;
car=Math.min(carMax,car+w*eff*dt);sol+=p*dt;ser.push([ms,E/cap*100])}
if(hs===null)hs=E/cap*100;
var d0=new Date(t.c),si=sunInfo(d0),en=car/carMax*100,low=E/cap*100;
var r='<div class="g"><div class="k"><span>Auto a fine ricarica</span><b style="color:var(--car)">'+en.toFixed(0)+'%</b></div>'+
'<div class="k"><span>Casa a fine ricarica</span><b class="'+(exh?'bad':'ok')+'">'+low.toFixed(0)+'%</b></div>'+
'<div class="k"><span>Casa a inizio ricarica</span><b>'+hs.toFixed(0)+'%</b></div>'+
'<div class="k"><span>Picco consumo casa</span><b>'+peak.toFixed(1)+' kW</b></div></div>'+
'<p>'+(exh?'<b class="bad">⚠️ La batteria di casa si esaurisce alle '+hm(exh)+'</b>':'<b class="ok">✓ La batteria di casa non si esaurisce</b>')+'</p>'+
(thr?'<div class="sm bad">Ricarica ridotta per i limiti di potenza delle batterie dalle '+hm(thr)+'</div>':'')+'<div class="sm">Dalla presa: '+wall0.toFixed(2)+' kW → in auto ≈ '+(wall0*eff).toFixed(2)+' kW. Energia aggiunta all’auto: '+((en/100*carMax)-($("a").value/100*S.cap)).toFixed(1)+' kWh.<br>'+
(si?'Sole: alba '+hm(si.a)+', tramonto '+hm(si.b)+' (<b>'+si.h.toFixed(1).replace(".",",")+' h</b>). ':'')+'Produzione stimata nel periodo: '+sol.toFixed(1).replace(".",",")+' kWh.</div>';
$("res").innerHTML=r;
var cs=cloudOK&&auto?'Previsione automatica (Open-Meteo) per quel giorno':(auto?'':'Valore manuale');if(!cloudOK&&auto)cs='Valore manuale (previsione non disponibile)';$("cs").textContent=cs;
var W=300,H=90,x0=ser[0][0],x1=ser[ser.length-1][0],pts=ser.map(function(q){return((q[0]-x0)/(x1-x0||1)*W).toFixed(1)+","+(H-q[1]/100*H).toFixed(1)}).join(" "),
xs=(t.s-x0)/(x1-x0||1)*W,xe=(t.e-x0)/(x1-x0||1)*W;
$("ch").innerHTML='<rect x="'+xs+'" y="0" width="'+Math.max(0,xe-xs)+'" height="'+H+'" fill="var(--car)" opacity=".15"/><polyline points="'+pts+'" fill="none" stroke="var(--ac)" stroke-width="2"/><text x="2" y="10" font-size="9" fill="var(--mu)">100%</text><text x="2" y="'+(H-2)+'" font-size="9" fill="var(--mu)">0%</text>';
$("hv").textContent=$("h").value+"%";$("av").textContent=$("a").value+"%";$("cv").textContent=$("cl").value+"%";$("kwv").textContent=S.amp+" A · "+wall0.toFixed(1).replace(".",",")+" kW"}
function nowStr(){var d=new Date();d.setSeconds(0,0);return iso(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
var ab=$("amps");[6,8,10,13,16].forEach(function(a){var b=document.createElement("button");b.textContent=a;b.onclick=function(){S.amp=a;save();mark();calc()};ab.appendChild(b)});
function mark(){[].forEach.call(ab.children,function(b){b.className=(+b.textContent===S.amp)?"on":""})}
$("dt").value=nowStr();$("now").onclick=function(){$("dt").value=nowStr();loadCloud()};
$("ld").value=S.ld!==null&&S.ld!==undefined?S.ld:S.base;
["base","cap","eff","bat","pk","chg","dis","tot"].forEach(function(k){$(k).value=S[k];$(k).oninput=function(){var v=parseFloat($(k).value);if(v>0){S[k]=v;if(k==="base"){$("ld").value=v;S.ld=null}save();calc()}}});
$("ld").oninput=function(){S.ld=parseFloat($("ld").value)||0;save();calc()};
["h","a","st","en"].forEach(function(i){$(i).oninput=calc});
$("dt").onchange=function(){loadCloud()};$("st").onchange=$("en").onchange=function(){loadCloud()};
$("cl").oninput=function(){auto=false;calc()};$("auto").onclick=function(){auto=true;loadCloud()};
mark();calc();loadCloud();
</script><script>if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})</script></body></html>
